<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Login</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%23{{ theme.primary[1:] }}'/><text x='32' y='45' font-family='Arial, sans-serif' font-size='36' font-weight='700' fill='white' text-anchor='middle'>P</text></svg>">
<style>
  :root {
    --primary: {{ theme.primary }};
    --primary-rgb: {{ theme.primary_rgb }};
    --bg-top: {{ theme.bg_top }};
    --card: {{ theme.card }};
    --text: {{ theme.text }};
    --muted: color-mix(in srgb, var(--text) 58%, var(--bg-top));
    --border: color-mix(in srgb, var(--text) 11%, transparent);
    --danger: #ff6b81;
    --field-bg: color-mix(in srgb, var(--card) 88%, var(--text) 7%);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: {{ theme.font | safe }}, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(ellipse 700px 400px at 50% -10%, color-mix(in srgb, var(--bg-top) 88%, var(--primary) 12%), transparent),
      var(--bg-top);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }
  form {
    width: 100%;
    max-width: 320px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 30px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  h1 { margin: 0 0 4px; font-size: 1.15rem; font-weight: 600; letter-spacing: -0.1px; }
  input {
    background: var(--field-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 12px 14px;
    font-size: 0.95rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: color-mix(in srgb, var(--primary) 55%, var(--border)); }
  button {
    background: var(--primary);
    border: none;
    border-radius: 12px;
    color: #fff;
    padding: 12px 14px;
    font-size: 0.95rem;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  button:active { opacity: 0.85; }
  .error { color: var(--danger); font-size: 0.85rem; margin: 0; }
</style>
</head>
<body>
  <form method="post">
    <h1>Admin Login</h1>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
    <input type="password" name="password" placeholder="รหัสผ่านแอดมิน" autofocus required>
    <button type="submit">เข้าสู่ระบบ</button>
  </form>
</body>
</html>
