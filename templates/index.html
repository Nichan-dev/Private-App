<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แชทง่ายๆ</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --primary: #8b7cf9;
    --primary-dark: #6d5ef7;
    --bg-top: #1a1625;
    --bg-bottom: #170f1a;
    --card: #201a2c;
    --text: #f1eef8;
    --muted: #948fac;
    --border: #362f47;
    --bubble-them: #2b2438;
    --danger: #ff6b81;
    --field-bg: #271f36;
    --field-bg-focus: #322947;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  #app {
    position: relative;
    width: 100%;
    max-width: 460px;
    height: 100vh;
    max-height: 900px;
    background: var(--card);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, 0.6);
  }

  @media (min-width: 480px) {
    body { padding: 24px; }
    #app { height: 92vh; border-radius: 28px; }
  }

  /* ---------- Header ---------- */
  .top-bar {
    position: relative;
    flex-shrink: 0;
    padding: 18px 20px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    text-align: center;
  }
  .top-bar h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .top-bar .sub {
    margin-top: 2px;
    font-size: 0.78rem;
    opacity: 0.85;
  }
  #my-code-badge {
    position: absolute;
    top: 12px;
    right: 14px;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(255, 255, 255, 0.18);
    color: white;
    border: none;
    padding: 4px 9px;
    border-radius: 999px;
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    cursor: pointer;
    font-family: inherit;
  }
  #my-code-badge:active { transform: scale(0.95); }
  #my-code-badge .hint { font-weight: 400; opacity: 0.8; }

  /* ---------- Setup screen ---------- */
  #setup {
    flex: 1;
    overflow-y: auto;
    padding: 24px 22px 28px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .field-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin: 14px 0 2px;
  }
  #setup input {
    width: 100%;
    padding: 13px 14px;
    font-size: 0.95rem;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--field-bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.15s, background 0.15s;
    font-family: inherit;
  }
  #setup input::placeholder { color: var(--muted); }
  #setup input:focus {
    border-color: var(--primary);
    background: var(--field-bg-focus);
  }
  .name-row { margin-bottom: 4px; }

  .section-card {
    margin-top: 14px;
    padding: 14px 14px 16px;
    border-radius: 16px;
    background: #251e33;
    border: 1px solid var(--border);
  }
  .section-title {
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn {
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    font-family: inherit;
    transition: transform 0.08s, opacity 0.15s, box-shadow 0.15s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    margin-top: 10px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    box-shadow: 0 8px 20px -8px rgba(109, 94, 247, 0.7);
  }
  .btn-outline {
    margin-top: 10px;
    background: transparent;
    color: var(--primary);
    border: 1.5px solid var(--primary);
  }

  #error {
    color: var(--danger);
    text-align: center;
    min-height: 1.2em;
    font-size: 0.85rem;
    margin-top: 10px;
    font-weight: 600;
  }

  /* ---------- Chat screen ---------- */
  #chat { display: none; flex-direction: column; flex: 1; min-height: 0; }

  #room-info {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    font-size: 0.78rem;
    color: var(--muted);
    background: #1c1726;
    border-bottom: 1px solid var(--border);
  }
  #room-label { font-weight: 700; color: var(--text); }
  #room-code-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: rgba(139, 124, 249, 0.18);
    color: var(--primary);
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    cursor: pointer;
    border: none;
    font-size: 0.78rem;
    font-family: inherit;
  }
  #room-code-pill:active { transform: scale(0.96); }

  #messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
    background:
      radial-gradient(circle at 15% 0%, #241d33 0%, transparent 45%),
      var(--bg-top);
  }
  .msg {
    max-width: 78%;
    padding: 9px 13px;
    border-radius: 18px;
    font-size: 0.93rem;
    line-height: 1.35;
    animation: pop-in 0.15s ease-out;
  }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(4px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg .meta {
    font-size: 0.68rem;
    opacity: 0.65;
    margin-bottom: 3px;
    font-weight: 600;
  }
  .msg .seen {
    font-size: 0.66rem;
    opacity: 0.8;
    text-align: right;
    margin-top: 3px;
    min-height: 1em;
    font-weight: 600;
  }
  .msg.me {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border-bottom-right-radius: 5px;
  }
  .msg.me .meta { color: rgba(255,255,255,0.75); }
  .msg.them {
    align-self: flex-start;
    background: var(--bubble-them);
    color: var(--text);
    border-bottom-left-radius: 5px;
  }
  .msg.system {
    align-self: center;
    background: #2b2438;
    color: var(--muted);
    font-size: 0.75rem;
    padding: 5px 12px;
    border-radius: 999px;
  }

  #typing-indicator, #friend-typing-indicator {
    flex-shrink: 0;
    font-size: 0.78rem;
    color: var(--muted);
    min-height: 1.3rem;
    padding: 2px 18px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .typing-dots { display: inline-flex; gap: 3px; }
  .typing-dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-3px); opacity: 1; }
  }

  #send-form {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: #1c1726;
  }
  #send-form input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: var(--field-bg);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    font-family: inherit;
  }
  #send-form input::placeholder { color: var(--muted); }
  #send-form input:focus { border-color: var(--primary); background: var(--field-bg-focus); }
  #send-form button {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px -6px rgba(109, 94, 247, 0.8);
  }
  #send-form button:active { transform: scale(0.94); }

  /* ---------- Friends list ---------- */
  #friend-request-status { min-height: 1.1em; font-size: 0.8rem; color: var(--muted); margin-top: 6px; }
  .friend-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    border-radius: 12px;
    background: var(--field-bg);
    margin-bottom: 8px;
  }
  .friend-row:last-child { margin-bottom: 0; }
  .friend-row .friend-code { font-weight: 700; letter-spacing: 0.5px; }
  .friend-row-actions { display: flex; align-items: center; gap: 6px; }
  .friend-edit-btn { background: transparent !important; padding: 4px !important; font-size: 0.9rem; }
  .friend-row button {
    border: none;
    background: var(--primary);
    color: white;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
  }
  #friends-empty { color: var(--muted); font-size: 0.85rem; }

  /* ---------- Friend chat ---------- */
  #friend-chat { display: none; flex-direction: column; flex: 1; min-height: 0; }
  #friend-chat-info {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    font-size: 0.9rem;
    font-weight: 700;
    background: #1c1726;
    border-bottom: 1px solid var(--border);
  }
  #friend-chat-back {
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 1.2rem;
    cursor: pointer;
    padding: 0 4px 0 0;
  }
  #friend-messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
  }
  #friend-send-form {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: #1c1726;
  }
  #friend-send-form input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: var(--field-bg);
    color: var(--text);
    font-size: 0.95rem;
    outline: none;
    font-family: inherit;
  }
  #friend-send-form button {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    font-size: 1.1rem;
    cursor: pointer;
  }

  /* ---------- Friend request overlay ---------- */
  #friend-request-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(10, 8, 15, 0.7);
    align-items: center;
    justify-content: center;
    z-index: 20;
    padding: 24px;
  }
  .overlay-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 22px;
    width: 100%;
    max-width: 320px;
    text-align: center;
  }
  .overlay-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 10px; }
  .overlay-text { font-size: 0.9rem; margin-bottom: 18px; }
  .overlay-actions { display: flex; gap: 10px; }
  .overlay-actions .btn { margin-top: 0; }
</style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <h1>💬 แชทง่ายๆ</h1>
    <div class="sub" id="top-sub">คุยกันแบบส่วนตัว ไม่มีประวัติค้าง</div>
    <button id="my-code-badge" type="button" title="แตะเพื่อคัดลอกรหัสของฉัน">
      <span class="hint">รหัสฉัน</span> <span id="my-code">...</span> 📋
    </button>
  </div>

  <div id="setup">
    <div class="name-row">
      <div class="field-label">ชื่อของคุณ</div>
      <input type="text" id="name-input" placeholder="เช่น เก่ง" maxlength="30">
    </div>

    <div class="section-card">
      <div class="section-title">🤝 แอดเพื่อนด้วยรหัส</div>
      <input type="text" id="friend-code-input" placeholder="ใส่รหัสของเพื่อน (6 ตัว)" maxlength="6" style="text-transform: uppercase;">
      <button id="send-friend-request-btn" type="button" class="btn btn-primary">ส่งคำขอเพื่อน</button>
      <div id="friend-request-status"></div>
    </div>

    <div class="section-card" id="friends-section" style="display: none;">
      <div class="section-title">👥 เพื่อนของฉัน</div>
      <div id="friends-list"></div>
    </div>

    <div class="section-card">
      <div class="section-title">🆕 สร้างห้องใหม่</div>
      <input type="text" id="room-label-input" placeholder="ชื่อห้อง (ไม่บังคับ) เช่น คุยกับเก่ง" maxlength="40">
      <input type="text" id="custom-code-input" placeholder="ตั้งรหัสห้องเอง (ไม่บังคับ)" maxlength="20" style="margin-top: 8px;">
      <button id="create-btn" type="button" class="btn btn-outline">สร้างห้อง</button>
    </div>

    <div class="section-card">
      <div class="section-title">🔑 เข้าห้องที่มีอยู่</div>
      <input type="text" id="room-input" placeholder="ใส่รหัสห้องเพื่อนที่นี่" maxlength="20">
      <button id="join-btn" type="button" class="btn btn-outline">เข้าห้อง</button>
    </div>

    <div id="error"></div>
  </div>

  <div id="chat">
    <div id="room-info">
      <span id="room-label"></span>
      <button id="room-code-pill" type="button" title="แตะเพื่อคัดลอก">
        <span id="room-code"></span> 📋
      </button>
    </div>
    <div id="messages"></div>
    <div id="typing-indicator"></div>
    <form id="send-form">
      <input type="text" id="text-input" placeholder="พิมพ์ข้อความ..." autocomplete="off">
      <button type="submit" aria-label="ส่ง">➤</button>
    </form>
  </div>

  <div id="friend-chat">
    <div id="friend-chat-info">
      <button id="friend-chat-back" type="button" title="กลับ">←</button>
      <span id="friend-chat-name"></span>
    </div>
    <div id="friend-messages"></div>
    <div id="friend-typing-indicator"></div>
    <form id="friend-send-form">
      <input type="text" id="friend-text-input" placeholder="พิมพ์ข้อความ..." autocomplete="off">
      <button type="submit" aria-label="ส่ง">➤</button>
    </form>
  </div>

  <div id="friend-request-overlay">
    <div class="overlay-card">
      <div class="overlay-title">🤝 คำขอเพิ่มเพื่อน</div>
      <div class="overlay-text">รหัส <b id="fr-code"></b> ขอเพิ่มคุณเป็นเพื่อน</div>
      <div class="overlay-actions">
        <button id="fr-reject" type="button" class="btn btn-outline">ปฏิเสธ</button>
        <button id="fr-accept" type="button" class="btn btn-primary">ยอมรับ</button>
      </div>
    </div>
  </div>
</div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const socket = io();
    let myName = "";

    const setupEl = document.getElementById("setup");
    const chatEl = document.getElementById("chat");
    const errorEl = document.getElementById("error");
    const messagesEl = document.getElementById("messages");
    const roomCodeEl = document.getElementById("room-code");

    document.getElementById("create-btn").onclick = async () => {
      errorEl.textContent = "";
      const label = document.getElementById("room-label-input").value.trim();
      const code = document.getElementById("custom-code-input").value.trim();
      const res = await fetch("/api/create-room", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ label, code }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.error || "สร้างห้องไม่สำเร็จ";
        return;
      }
      document.getElementById("room-input").value = data.room;
      doJoin(data.room);
    };

    document.getElementById("join-btn").onclick = () => {
      errorEl.textContent = "";
      const room = document.getElementById("room-input").value.trim();
      if (!room) { errorEl.textContent = "กรอกรหัสห้องก่อนครับ"; return; }
      doJoin(room);
    };

    document.getElementById("room-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); document.getElementById("join-btn").click(); }
    });

    // --- รหัสส่วนตัว (คงที่ถาวรต่อเบราว์เซอร์นี้) + แอดเพื่อน ---
    let myCode = "";
    const myCodeEl = document.getElementById("my-code");

    socket.on("connect", () => {
      socket.emit("register_code", { code: localStorage.getItem("myChatCode") || "" });
    });

    socket.on("your_code", (data) => {
      myCode = data.code;
      myCodeEl.textContent = myCode;
      localStorage.setItem("myChatCode", myCode);
    });

    document.getElementById("my-code-badge").addEventListener("click", () => {
      if (myCode && navigator.clipboard) navigator.clipboard.writeText(myCode).catch(() => {});
    });

    // --- ส่งคำขอเพื่อน ---
    const friendReqStatusEl = document.getElementById("friend-request-status");

    document.getElementById("send-friend-request-btn").onclick = () => {
      friendReqStatusEl.textContent = "";
      errorEl.textContent = "";
      const friendCode = document.getElementById("friend-code-input").value.trim().toUpperCase();
      if (!friendCode) { errorEl.textContent = "กรอกรหัสเพื่อนก่อนครับ"; return; }
      if (getFriends().some((f) => f.code === friendCode)) {
        friendReqStatusEl.textContent = "เป็นเพื่อนกันอยู่แล้ว";
        return;
      }
      socket.emit("friend_request", { code: friendCode });
      friendReqStatusEl.textContent = "ส่งคำขอแล้ว รอเพื่อนกดยอมรับ...";
    };

    document.getElementById("friend-code-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); document.getElementById("send-friend-request-btn").click(); }
    });

    socket.on("friend_error", (data) => {
      friendReqStatusEl.textContent = data.message;
      errorEl.textContent = data.message;
    });

    // --- รับคำขอเพื่อนเข้ามา ---
    const overlayEl = document.getElementById("friend-request-overlay");
    let incomingRequestCode = null;

    socket.on("friend_request_received", (data) => {
      incomingRequestCode = data.code;
      document.getElementById("fr-code").textContent = data.code;
      overlayEl.style.display = "flex";
    });

    document.getElementById("fr-accept").onclick = () => {
      socket.emit("friend_response", { code: incomingRequestCode, accepted: true });
      addFriend(incomingRequestCode);
      overlayEl.style.display = "none";
    };

    document.getElementById("fr-reject").onclick = () => {
      socket.emit("friend_response", { code: incomingRequestCode, accepted: false });
      overlayEl.style.display = "none";
    };

    socket.on("friend_response_received", (data) => {
      if (data.accepted) {
        addFriend(data.code);
        friendReqStatusEl.textContent = `${data.code} ยอมรับคำขอแล้ว เป็นเพื่อนกันแล้ว!`;
      } else {
        friendReqStatusEl.textContent = `${data.code} ปฏิเสธคำขอเพื่อน`;
      }
    });

    // --- รายชื่อเพื่อน (เก็บใน localStorage) ---
    function getFriends() {
      try { return JSON.parse(localStorage.getItem("myFriends") || "[]"); }
      catch { return []; }
    }

    function addFriend(code) {
      const friends = getFriends();
      if (!friends.some((f) => f.code === code)) {
        friends.push({ code, nickname: "" });
        localStorage.setItem("myFriends", JSON.stringify(friends));
      }
      renderFriends();
    }

    function renderFriends() {
      const friends = getFriends();
      const section = document.getElementById("friends-section");
      const list = document.getElementById("friends-list");
      list.innerHTML = "";

      if (friends.length === 0) {
        section.style.display = "none";
        return;
      }
      section.style.display = "block";

      for (const f of friends) {
        const row = document.createElement("div");
        row.className = "friend-row";
        row.innerHTML = `<span class="friend-code">${escapeHtml(getFriendLabel(f.code))}</span>`;

        const actions = document.createElement("div");
        actions.className = "friend-row-actions";

        const editBtn = document.createElement("button");
        editBtn.textContent = "✏️";
        editBtn.title = "ตั้งชื่อเล่น";
        editBtn.className = "friend-edit-btn";
        editBtn.onclick = () => renameFriend(f.code);
        actions.appendChild(editBtn);

        const chatBtn = document.createElement("button");
        chatBtn.textContent = "แชท";
        chatBtn.onclick = () => openFriendChat(f.code);
        actions.appendChild(chatBtn);

        row.appendChild(actions);
        list.appendChild(row);
      }
    }

    function getFriendLabel(code) {
      const friend = getFriends().find((f) => f.code === code);
      return friend && friend.nickname ? friend.nickname : code;
    }

    function renameFriend(code) {
      const friends = getFriends();
      const friend = friends.find((f) => f.code === code);
      if (!friend) return;
      const nickname = prompt("ตั้งชื่อเล่นให้เพื่อน", friend.nickname || "");
      if (nickname === null) return; // กดยกเลิก
      friend.nickname = nickname.trim().slice(0, 30);
      localStorage.setItem("myFriends", JSON.stringify(friends));
      renderFriends();
      if (activeFriendCode === code) {
        document.getElementById("friend-chat-name").textContent = getFriendLabel(code);
      }
    }

    renderFriends();

    // --- แชทกับเพื่อน (แยกจากระบบห้อง) ---
    const friendChatEl = document.getElementById("friend-chat");
    const friendMessagesEl = document.getElementById("friend-messages");
    const messagesByFriend = {}; // code -> [{mine, text, time}]
    let activeFriendCode = null;

    function openFriendChat(code) {
      activeFriendCode = code;
      document.getElementById("friend-chat-name").textContent = getFriendLabel(code);
      friendTypingEl.textContent = "";
      setupEl.style.display = "none";
      chatEl.style.display = "none";
      friendChatEl.style.display = "flex";
      renderFriendMessages();
      socket.emit("friend_seen", { code });
    }

    document.getElementById("friend-chat-back").onclick = () => {
      activeFriendCode = null;
      friendChatEl.style.display = "none";
      setupEl.style.display = "flex";
    };

    function renderFriendMessages() {
      friendMessagesEl.innerHTML = "";
      const list = messagesByFriend[activeFriendCode] || [];
      for (const m of list) {
        const div = document.createElement("div");
        div.className = "msg " + (m.mine ? "me" : "them");
        div.innerHTML = `<div class="meta">${m.mine ? "คุณ" : escapeHtml(getFriendLabel(activeFriendCode))} · ${m.time}</div>${escapeHtml(m.text)}` +
          (m.mine ? `<div class="seen">${m.seen ? "อ่านแล้ว ✓✓" : ""}</div>` : "");
        friendMessagesEl.appendChild(div);
      }
      friendMessagesEl.scrollTop = friendMessagesEl.scrollHeight;
    }

    let hasUnseenFriendIncoming = false;

    socket.on("friend_message", (data) => {
      const list = (messagesByFriend[data.from] = messagesByFriend[data.from] || []);
      list.push({ mine: false, text: data.text, time: data.time });
      if (activeFriendCode === data.from) {
        renderFriendMessages();
        if (document.visibilityState === "visible") {
          socket.emit("friend_seen", { code: data.from });
        } else {
          hasUnseenFriendIncoming = true;
        }
      }
      // ถ้ายังไม่เคยเป็นเพื่อนในลิสต์ (เผื่อกรณีข้อความมาก่อนรีเฟรช) ก็เพิ่มให้อัตโนมัติ
      if (!getFriends().some((f) => f.code === data.from)) addFriend(data.from);
    });

    socket.on("friend_seen", (data) => {
      const list = messagesByFriend[data.code];
      if (!list) return;
      for (let i = list.length - 1; i >= 0; i--) {
        if (list[i].mine) { list[i].seen = true; break; }
      }
      if (activeFriendCode === data.code) renderFriendMessages();
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && hasUnseenFriendIncoming && activeFriendCode) {
        socket.emit("friend_seen", { code: activeFriendCode });
        hasUnseenFriendIncoming = false;
      }
    });

    document.getElementById("friend-send-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("friend-text-input");
      const text = input.value.trim();
      if (!text || !activeFriendCode) return;
      socket.emit("friend_message", { code: activeFriendCode, text });
      const list = (messagesByFriend[activeFriendCode] = messagesByFriend[activeFriendCode] || []);
      list.push({ mine: true, text, time: new Date().toTimeString().slice(0, 5) });
      renderFriendMessages();
      input.value = "";
      stopFriendTyping();
    });

    // --- กำลังพิมพ์ (friend chat) ---
    const friendTypingEl = document.getElementById("friend-typing-indicator");
    let isFriendTyping = false;
    let friendTypingTimeout = null;

    document.getElementById("friend-text-input").addEventListener("input", () => {
      if (!activeFriendCode) return;
      if (!isFriendTyping) {
        isFriendTyping = true;
        socket.emit("friend_typing", { code: activeFriendCode, typing: true });
      }
      clearTimeout(friendTypingTimeout);
      friendTypingTimeout = setTimeout(stopFriendTyping, 1500);
    });

    function stopFriendTyping() {
      if (isFriendTyping && activeFriendCode) {
        isFriendTyping = false;
        socket.emit("friend_typing", { code: activeFriendCode, typing: false });
      }
      clearTimeout(friendTypingTimeout);
    }

    socket.on("friend_typing", (data) => {
      if (data.code !== activeFriendCode) return;
      friendTypingEl.innerHTML = data.typing
        ? `${escapeHtml(getFriendLabel(data.code))} กำลังพิมพ์ <span class="typing-dots"><span></span><span></span><span></span></span>`
        : "";
    });

    function doJoin(room) {
      myName = document.getElementById("name-input").value.trim() || "ไม่ระบุชื่อ";
      socket.emit("join", { room, name: myName });
    }

    socket.on("join_error", (data) => {
      errorEl.textContent = data.message;
    });

    socket.on("joined", (data) => {
      setupEl.style.display = "none";
      chatEl.style.display = "flex";
      roomCodeEl.textContent = data.room;
      document.getElementById("room-label").textContent = data.label ? data.label : "ห้องแชท";
      window._room = data.room;
    });

    document.getElementById("room-code-pill").addEventListener("click", () => {
      const code = roomCodeEl.textContent;
      if (navigator.clipboard) navigator.clipboard.writeText(code).catch(() => {});
    });

    socket.on("system", (data) => {
      addMessage({ system: true, text: data.text, time: data.time });
    });

    let lastMineMsgEl = null;
    let hasUnseenIncoming = false;

    socket.on("message", (data) => {
      const mine = data.name === myName;
      const div = addMessage({ mine, name: data.name, text: data.text, time: data.time });
      if (mine) {
        lastMineMsgEl = div;
      } else if (document.visibilityState === "visible") {
        socket.emit("seen", { room: window._room });
      } else {
        hasUnseenIncoming = true;
      }
    });

    socket.on("seen", () => {
      if (lastMineMsgEl) {
        const seenEl = lastMineMsgEl.querySelector(".seen");
        if (seenEl) seenEl.textContent = "อ่านแล้ว ✓✓";
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && hasUnseenIncoming) {
        socket.emit("seen", { room: window._room });
        hasUnseenIncoming = false;
      }
    });

    function addMessage({ system, mine, name, text, time }) {
      const div = document.createElement("div");
      div.className = "msg " + (system ? "system" : mine ? "me" : "them");
      if (system) {
        div.textContent = text;
      } else {
        div.innerHTML = `<div class="meta">${mine ? "คุณ" : escapeHtml(name)} · ${time}</div>${escapeHtml(text)}` +
          (mine ? `<div class="seen"></div>` : "");
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    document.getElementById("send-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("text-input");
      const text = input.value.trim();
      if (!text) return;
      socket.emit("message", { room: window._room, text });
      input.value = "";
      stopTyping();
    });

    const typingEl = document.getElementById("typing-indicator");
    let isTyping = false;
    let typingTimeout = null;

    document.getElementById("text-input").addEventListener("input", () => {
      if (!isTyping) {
        isTyping = true;
        socket.emit("typing", { room: window._room, typing: true });
      }
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(stopTyping, 1500);
    });

    function stopTyping() {
      if (isTyping) {
        isTyping = false;
        socket.emit("typing", { room: window._room, typing: false });
      }
      clearTimeout(typingTimeout);
    }

    socket.on("typing", (data) => {
      if (data.name === myName) return;
      typingEl.innerHTML = data.typing
        ? `${escapeHtml(data.name)} กำลังพิมพ์ <span class="typing-dots"><span></span><span></span><span></span></span>`
        : "";
    });
  </script>
</body>
</html>
