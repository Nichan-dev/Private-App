<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แชทง่ายๆ</title>
<style>
  * { box-sizing: border-box; }

  :root {
    --primary: #6d5ef7;
    --primary-dark: #5642e0;
    --bg-top: #eef0ff;
    --bg-bottom: #fdf1f7;
    --card: #ffffff;
    --text: #1f2233;
    --muted: #8b8fa3;
    --border: #ececf4;
    --bubble-them: #f2f2f8;
    --danger: #e0335f;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    color: var(--text);
    background: linear-gradient(160deg, var(--bg-top), var(--bg-bottom));
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  #app {
    width: 100%;
    max-width: 460px;
    height: 100vh;
    max-height: 900px;
    background: var(--card);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 30px 60px -20px rgba(80, 60, 200, 0.25);
  }

  @media (min-width: 480px) {
    body { padding: 24px; }
    #app { height: 92vh; border-radius: 28px; }
  }

  /* ---------- Header ---------- */
  .top-bar {
    flex-shrink: 0;
    padding: 18px 20px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    text-align: center;
  }
  .top-bar h1 {
    margin: 0;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.2px;
  }
  .top-bar .sub {
    margin-top: 2px;
    font-size: 0.78rem;
    opacity: 0.85;
  }

  /* ---------- Setup screen ---------- */
  #setup {
    flex: 1;
    overflow-y: auto;
    padding: 24px 22px 28px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .field-label {
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--muted);
    margin: 14px 0 2px;
  }
  #setup input {
    width: 100%;
    padding: 13px 14px;
    font-size: 0.95rem;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: #fafafd;
    outline: none;
    transition: border-color 0.15s, background 0.15s;
    font-family: inherit;
  }
  #setup input:focus {
    border-color: var(--primary);
    background: white;
  }
  .name-row { margin-bottom: 4px; }

  .section-card {
    margin-top: 14px;
    padding: 14px 14px 16px;
    border-radius: 16px;
    background: #f8f8fc;
    border: 1px solid var(--border);
  }
  .section-title {
    font-size: 0.85rem;
    font-weight: 700;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .btn {
    border: none;
    border-radius: 12px;
    padding: 13px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    font-family: inherit;
    transition: transform 0.08s, opacity 0.15s, box-shadow 0.15s;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary {
    margin-top: 10px;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    box-shadow: 0 8px 20px -8px rgba(109, 94, 247, 0.7);
  }
  .btn-outline {
    margin-top: 10px;
    background: white;
    color: var(--primary-dark);
    border: 1.5px solid var(--primary);
  }

  #error {
    color: var(--danger);
    text-align: center;
    min-height: 1.2em;
    font-size: 0.85rem;
    margin-top: 10px;
    font-weight: 600;
  }

  /* ---------- Chat screen ---------- */
  #chat { display: none; flex-direction: column; flex: 1; min-height: 0; }

  #room-info {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 16px;
    font-size: 0.78rem;
    color: var(--muted);
    background: #fbfbfe;
    border-bottom: 1px solid var(--border);
  }
  #room-label { font-weight: 700; color: var(--text); }
  #room-code-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: #efecff;
    color: var(--primary-dark);
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    cursor: pointer;
    border: none;
    font-size: 0.78rem;
    font-family: inherit;
  }
  #room-code-pill:active { transform: scale(0.96); }

  #messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
    background:
      radial-gradient(circle at 15% 0%, #f6f4ff 0%, transparent 45%),
      #ffffff;
  }
  .msg {
    max-width: 78%;
    padding: 9px 13px;
    border-radius: 18px;
    font-size: 0.93rem;
    line-height: 1.35;
    animation: pop-in 0.15s ease-out;
  }
  @keyframes pop-in {
    from { opacity: 0; transform: translateY(4px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .msg .meta {
    font-size: 0.68rem;
    opacity: 0.65;
    margin-bottom: 3px;
    font-weight: 600;
  }
  .msg .seen {
    font-size: 0.66rem;
    opacity: 0.8;
    text-align: right;
    margin-top: 3px;
    min-height: 1em;
    font-weight: 600;
  }
  .msg.me {
    align-self: flex-end;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    border-bottom-right-radius: 5px;
  }
  .msg.me .meta { color: rgba(255,255,255,0.75); }
  .msg.them {
    align-self: flex-start;
    background: var(--bubble-them);
    color: var(--text);
    border-bottom-left-radius: 5px;
  }
  .msg.system {
    align-self: center;
    background: #f3f1fb;
    color: var(--muted);
    font-size: 0.75rem;
    padding: 5px 12px;
    border-radius: 999px;
  }

  #typing-indicator {
    flex-shrink: 0;
    font-size: 0.78rem;
    color: var(--muted);
    min-height: 1.3rem;
    padding: 2px 18px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .typing-dots { display: inline-flex; gap: 3px; }
  .typing-dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-3px); opacity: 1; }
  }

  #send-form {
    flex-shrink: 0;
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid var(--border);
    background: white;
  }
  #send-form input {
    flex: 1;
    padding: 12px 16px;
    border-radius: 999px;
    border: 1.5px solid var(--border);
    background: #fafafd;
    font-size: 0.95rem;
    outline: none;
    font-family: inherit;
  }
  #send-form input:focus { border-color: var(--primary); background: white; }
  #send-form button {
    width: 44px;
    height: 44px;
    flex-shrink: 0;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    font-size: 1.1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 6px 16px -6px rgba(109, 94, 247, 0.8);
  }
  #send-form button:active { transform: scale(0.94); }
</style>
</head>
<body>
<div id="app">
  <div class="top-bar">
    <h1>💬 แชทง่ายๆ</h1>
    <div class="sub" id="top-sub">คุยกันแบบส่วนตัว ไม่มีประวัติค้าง</div>
  </div>

  <div id="setup">
    <div class="name-row">
      <div class="field-label">ชื่อของคุณ</div>
      <input type="text" id="name-input" placeholder="เช่น เก่ง" maxlength="30">
    </div>

    <div class="section-card">
      <div class="section-title">🆕 สร้างห้องใหม่</div>
      <input type="text" id="room-label-input" placeholder="ชื่อห้อง (ไม่บังคับ) เช่น คุยกับเก่ง" maxlength="40">
      <input type="text" id="custom-code-input" placeholder="ตั้งรหัสห้องเอง (ไม่บังคับ)" maxlength="20" style="margin-top: 8px;">
      <button id="create-btn" type="button" class="btn btn-primary">สร้างห้อง</button>
    </div>

    <div class="section-card">
      <div class="section-title">🔑 เข้าห้องที่มีอยู่</div>
      <input type="text" id="room-input" placeholder="ใส่รหัสห้องเพื่อนที่นี่" maxlength="20">
      <button id="join-btn" type="button" class="btn btn-outline">เข้าห้อง</button>
    </div>

    <div id="error"></div>
  </div>

  <div id="chat">
    <div id="room-info">
      <span id="room-label"></span>
      <button id="room-code-pill" type="button" title="แตะเพื่อคัดลอก">
        <span id="room-code"></span> 📋
      </button>
    </div>
    <div id="messages"></div>
    <div id="typing-indicator"></div>
    <form id="send-form">
      <input type="text" id="text-input" placeholder="พิมพ์ข้อความ..." autocomplete="off">
      <button type="submit" aria-label="ส่ง">➤</button>
    </form>
  </div>
</div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const socket = io();
    let myName = "";

    const setupEl = document.getElementById("setup");
    const chatEl = document.getElementById("chat");
    const errorEl = document.getElementById("error");
    const messagesEl = document.getElementById("messages");
    const roomCodeEl = document.getElementById("room-code");

    document.getElementById("create-btn").onclick = async () => {
      errorEl.textContent = "";
      const label = document.getElementById("room-label-input").value.trim();
      const code = document.getElementById("custom-code-input").value.trim();
      const res = await fetch("/api/create-room", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ label, code }),
      });
      const data = await res.json();
      if (!res.ok) {
        errorEl.textContent = data.error || "สร้างห้องไม่สำเร็จ";
        return;
      }
      document.getElementById("room-input").value = data.room;
      doJoin(data.room);
    };

    document.getElementById("join-btn").onclick = () => {
      errorEl.textContent = "";
      const room = document.getElementById("room-input").value.trim();
      if (!room) { errorEl.textContent = "กรอกรหัสห้องก่อนครับ"; return; }
      doJoin(room);
    };

    document.getElementById("room-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") { e.preventDefault(); document.getElementById("join-btn").click(); }
    });

    function doJoin(room) {
      myName = document.getElementById("name-input").value.trim() || "ไม่ระบุชื่อ";
      socket.emit("join", { room, name: myName });
    }

    socket.on("join_error", (data) => {
      errorEl.textContent = data.message;
    });

    socket.on("joined", (data) => {
      setupEl.style.display = "none";
      chatEl.style.display = "flex";
      roomCodeEl.textContent = data.room;
      document.getElementById("room-label").textContent = data.label ? data.label : "ห้องแชท";
      window._room = data.room;
    });

    document.getElementById("room-code-pill").addEventListener("click", () => {
      const code = roomCodeEl.textContent;
      if (navigator.clipboard) navigator.clipboard.writeText(code).catch(() => {});
    });

    socket.on("system", (data) => {
      addMessage({ system: true, text: data.text, time: data.time });
    });

    let lastMineMsgEl = null;
    let hasUnseenIncoming = false;

    socket.on("message", (data) => {
      const mine = data.name === myName;
      const div = addMessage({ mine, name: data.name, text: data.text, time: data.time });
      if (mine) {
        lastMineMsgEl = div;
      } else if (document.visibilityState === "visible") {
        socket.emit("seen", { room: window._room });
      } else {
        hasUnseenIncoming = true;
      }
    });

    socket.on("seen", () => {
      if (lastMineMsgEl) {
        const seenEl = lastMineMsgEl.querySelector(".seen");
        if (seenEl) seenEl.textContent = "อ่านแล้ว ✓✓";
      }
    });

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible" && hasUnseenIncoming) {
        socket.emit("seen", { room: window._room });
        hasUnseenIncoming = false;
      }
    });

    function addMessage({ system, mine, name, text, time }) {
      const div = document.createElement("div");
      div.className = "msg " + (system ? "system" : mine ? "me" : "them");
      if (system) {
        div.textContent = text;
      } else {
        div.innerHTML = `<div class="meta">${mine ? "คุณ" : escapeHtml(name)} · ${time}</div>${escapeHtml(text)}` +
          (mine ? `<div class="seen"></div>` : "");
      }
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    function escapeHtml(str) {
      const d = document.createElement("div");
      d.textContent = str;
      return d.innerHTML;
    }

    document.getElementById("send-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("text-input");
      const text = input.value.trim();
      if (!text) return;
      socket.emit("message", { room: window._room, text });
      input.value = "";
      stopTyping();
    });

    const typingEl = document.getElementById("typing-indicator");
    let isTyping = false;
    let typingTimeout = null;

    document.getElementById("text-input").addEventListener("input", () => {
      if (!isTyping) {
        isTyping = true;
        socket.emit("typing", { room: window._room, typing: true });
      }
      clearTimeout(typingTimeout);
      typingTimeout = setTimeout(stopTyping, 1500);
    });

    function stopTyping() {
      if (isTyping) {
        isTyping = false;
        socket.emit("typing", { room: window._room, typing: false });
      }
      clearTimeout(typingTimeout);
    }

    socket.on("typing", (data) => {
      if (data.name === myName) return;
      typingEl.innerHTML = data.typing
        ? `${escapeHtml(data.name)} กำลังพิมพ์ <span class="typing-dots"><span></span><span></span><span></span></span>`
        : "";
    });
  </script>
</body>
</html>
